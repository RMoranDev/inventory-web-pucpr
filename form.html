<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Inventory Web</title>

    <link rel="icon" href="./imagens/favicon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="./estilos/style.css">

    <script src="./scripts/main.js" defer></script>
    <script src="./scripts/form.js" defer></script>
</head>

<body>

    <div id="header-container"></div>

    <main class="pagina-cadastro">

        <h1>Cadastro de produtos</h1>
        <p>Todos os campos são obrigatórios.</p>

        <form id="form-produto" action="./formAction.html" method="get">
            <input type="hidden" id="idCadastro" name="idCadastro">
            <div class="campo">
                <label for="nome">Nome do produto</label>
                <input type="text" id="nome" name="nome" minlength="3" maxlength="100" required>
                <small class="mensagem" id="mensagem-nome"></small>
            </div>

            <div class="campo">
                <label for="sku">Código SKU</label>
                <input type="text" id="sku" name="sku" pattern="[A-Z]{3}-[0-9]{4}" placeholder="ABC-1234" maxlength="8" required>
                <small class="mensagem" id="mensagem-sku"></small>
            </div>
            <div class="campo">
                <label for="categoria">Categoria</label>
                <select name="categoria" id="categoria" required>
                    <option value="" disabled selected>Selecione</option>
                    <option value="hardware">Hardware</option>
                    <option value="perifericos">Periféricos</option>
                    <option value="redes">Redes</option>
                    <option value="cabos">Cabos</option>
                    <option value="moveis">Móveis</option>
                    <option value="monitor">Monitores</option>
                </select>
                <small class="mensagem" id="mensagem-categoria"></small>
            </div>
            <div class="campo">
                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade" name="quantidade" min="1" step="1" placeholder="1" required>
                <small class="mensagem" id="mensagem-quantidade"></small>
            </div>
            <div class="campo">
                <label for="preco">Preço (R$)</label>
                <input type="number" id="preco" name="preco" min="0" step="0.01" placeholder="R$ 0,00" required>
                <small class="mensagem" id="mensagem-preco"></small>
            </div>
            <div class="campo">
                <label for="data">Data de entrada</label>
                <input type="date" id="data" name="data" required>
                <small class="mensagem" id="mensagem-data"></small>
            </div>
            <div class="campo">
                <label for="observacoes">Observações</label>
                <textarea id="observacoes" name="observacoes" maxlength="255" required></textarea>
                <small class="mensagem" id="mensagem-observacoes"></small>
            </div>

            <div class="btn-cadastro">
                <button type="submit" class="botao botao-principal">Enviar cadastro</button>
                <button type="reset" class="botao botao-secundario">Limpar formulário</button>
            </div>
        </form>
    </main>

    <div id="footer-container"></div>
</body>

</html>
